# A Linux guest on an arm64 host. Like any arm64 guest it boots from the U-Boot
# image in the u-boot-bhyve-arm64 package, which scans the first virtio-blk
# device for /efi/boot/bootaa64.efi and chainloads it. That is the removable
# media path distribution cloud images carry, so write the image into disk0 and
# leave it first in the list.
#
# No console argument is needed in the guest: bhyve's device tree sets
# /chosen/stdout-path, so the kernel finds the console on its own.

loader="uboot"
cpu=1
memory="1G"
network0_type="virtio-net"
network0_switch="public"
disk0_type="virtio-blk"
disk0_name="disk0.img"
